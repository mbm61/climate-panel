<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9f1fb">
<script>try{var t=localStorage.getItem("climate.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Климат">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Климат</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="banner" class="banner" hidden></div>
<div id="stage"><div id="page"><header class="top">
  <button id="back" class="glass round" hidden aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1 id="title">Климат</h1>
  <div class="hdr-right">
    <button id="valve" class="glass round" hidden aria-label="Краны отопления"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9 4-9 4zM21 8l-9 4 9 4z"/><path d="M12 12V6M8 4.5h8"/></svg></button>
    <button id="svc" class="glass round conn-btn" data-s="idle" hidden aria-label="Связь с сервером"><svg class="i-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M9 15l2 2 4-4"/></svg><svg class="i-wait" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg><svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3M1 1l22 22"/></svg></button>
    <button id="info" class="glass round infobtn" hidden aria-label="Предупреждения"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.1"/></svg><b id="info-n"></b></button>
  </div>
</header><main id="app"></main></div><div id="prev" class="prevpage" hidden></div></div>
<div id="dlg" class="dlg" hidden><div class="dlg-box glass"><p></p><div class="actions"><button class="btn" data-cancel>Отмена</button><button class="btn active" data-ok>Подтвердить</button></div></div></div>
<div id="sheet" class="sheet" hidden><div id="sheet-card" class="sheet-card"><h2 id="sheet-title"></h2><div id="sheet-body"></div><div class="grab" aria-hidden="true"></div></div></div>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
